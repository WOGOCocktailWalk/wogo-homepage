  { pattern = "*wogococktailwalk.com/nl/booking-form*", zone_name = "wogococktailwalk.com" },
  { pattern = "*wogococktailwalk.com/nl/cancel-reservation*", zone_name = "wogococktailwalk.com" },
  { pattern = "*wogococktailwalk.com/nl/category/*", zone_name = "wogococktailwalk.com" },
  { pattern = "*wogococktailwalk.com/nl/copy-of-home*", zone_name = "wogococktailwalk.com" },
  { pattern = "*wogococktailwalk.com/nl/experience-details*", zone_name = "wogococktailwalk.com" },
  { pattern = "*wogococktailwalk.com/nl/experiences*", zone_name = "wogococktailwalk.com" },
