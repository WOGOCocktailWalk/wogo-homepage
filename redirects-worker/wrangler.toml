  { pattern = "*wogococktailwalk.com/workwithus*", zone_name = "wogococktailwalk.com" },
  { pattern = "*wogococktailwalk.com/blog/categories*", zone_name = "wogococktailwalk.com" },
  { pattern = "*wogococktailwalk.com/blog/tags*", zone_name = "wogococktailwalk.com" },
  { pattern = "*wogococktailwalk.com/category/*", zone_name = "wogococktailwalk.com" },
  { pattern = "*wogococktailwalk.com/product-page*", zone_name = "wogococktailwalk.com" },
  # The four occasion pages removed 23 Nov 2026 -> group page.
  { pattern = "*wogococktailwalk.com/date-night*", zone_name = "wogococktailwalk.com" },
  { pattern = "*wogococktailwalk.com/bachelorette*", zone_name = "wogococktailwalk.com" },
  { pattern = "*wogococktailwalk.com/birthday*", zone_name = "wogococktailwalk.com" },
  { pattern = "*wogococktailwalk.com/company-outing*", zone_name = "wogococktailwalk.com" },
  # Old Wix DUTCH addresses (/nl/<old name>). Only the old names are listed, so
  # the real Dutch pages of the new site (/nl/, /nl/faq/, /nl/rotterdam/... made
  # by tools/build-nl.js) are served straight by the website and never pass
  # through this helper. The Dutch blog (/nl/blog/...) is real since the blog
  # dashboard writes it; the catch-all below hands it through (worker.js), so it
  # needs no line of its own.
  # Catch-all for Dutch addresses: real Dutch pages pass straight through; an
  # old Dutch address that matches nothing goes to the Dutch homepage instead
  # of a "page not found" (owner's choice, 17 Nov 2026).
  { pattern = "*wogococktailwalk.com/nl", zone_name = "wogococktailwalk.com" },
  { pattern = "*wogococktailwalk.com/nl/*", zone_name = "wogococktailwalk.com" },
  { pattern = "*wogococktailwalk.com/nl/amsterdam-cocktail*", zone_name = "wogococktailwalk.com" },
  { pattern = "*wogococktailwalk.com/nl/barcelona-cocktailwalk*", zone_name = "wogococktailwalk.com" },
