  { pattern = "*wogococktailwalk.com/nl/plans-pricing*", zone_name = "wogococktailwalk.com" },
  { pattern = "*wogococktailwalk.com/nl/post/*", zone_name = "wogococktailwalk.com" },
  { pattern = "*wogococktailwalk.com/nl/privacy-policy*", zone_name = "wogococktailwalk.com" },
  { pattern = "*wogococktailwalk.com/nl/product-page*", zone_name = "wogococktailwalk.com" },
  { pattern = "*wogococktailwalk.com/nl/reservations*", zone_name = "wogococktailwalk.com" },
  { pattern = "*wogococktailwalk.com/nl/rotterdam-cocktail-walk*", zone_name = "wogococktailwalk.com" },
  { pattern = "*wogococktailwalk.com/nl/rotterdam-premium-cocktail-walk*", zone_name = "wogococktailwalk.com" },
  { pattern = "*wogococktailwalk.com/nl/schiedam-cocktail-walk*", zone_name = "wogococktailwalk.com" },
