name = "wogo-redirects"
main = "worker.js"
compatibility_date = "2026-01-01"
workers_dev = false

routes = [
  { pattern = "*wogococktailwalk.com/so/*", zone_name = "wogococktailwalk.com" },
  { pattern = "*wogococktailwalk.com/maps/*", zone_name = "wogococktailwalk.com" },
  { pattern = "http://*wogococktailwalk.com/*", zone_name = "wogococktailwalk.com" },
  { pattern = "*wogococktailwalk.com/amsterdam-cocktail*", zone_name = "wogococktailwalk.com" },
  { pattern = "*wogococktailwalk.com/barcelona-cocktailwalk*", zone_name = "wogococktailwalk.com" },
  { pattern = "*wogococktailwalk.com/bars", zone_name = "wogococktailwalk.com" },
  { pattern = "*wogococktailwalk.com/bars/*", zone_name = "wogococktailwalk.com" },
  { pattern = "*wogococktailwalk.com/book-online*", zone_name = "wogococktailwalk.com" },
  { pattern = "*wogococktailwalk.com/booking-calendar*", zone_name = "wogococktailwalk.com" },
  { pattern = "*wogococktailwalk.com/booking-form*", zone_name = "wogococktailwalk.com" },
