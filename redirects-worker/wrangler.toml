  { pattern = "*wogococktailwalk.com/nl/service-page*", zone_name = "wogococktailwalk.com" },
  { pattern = "*wogococktailwalk.com/nl/workwithus*", zone_name = "wogococktailwalk.com" },
  { pattern = "nl.wogococktailwalk.com/*", zone_name = "wogococktailwalk.com" },
