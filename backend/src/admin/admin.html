<!-- WOGO Admin — SPA shell. Served by the Worker at /admin.
     admin.css + admin.js are inlined at build time (see build.mjs). -->
<div id="wogo-admin">

  <!-- ================= LOGIN ================= -->
  <section class="login-wrap" id="login-view">
    <form class="login-card" id="login-form" autocomplete="off">
      <div class="login-mark">WO<span>G</span>O</div>
      <p class="login-sub">Booking control room · owner access</p>
      <div class="login-error" id="login-error" role="alert" aria-live="assertive"></div>
      <div class="field">
        <label for="admin-token">Admin token</label>
        <input type="password" id="admin-token" name="token" autocomplete="current-password"
               placeholder="Paste your admin token" required />
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="login-btn">Sign in</button>
      <p class="login-sub" style="margin-top:16px;margin-bottom:0;font-size:12px;">
        Your token is the long random secret stored in your Cloudflare account. It never leaves this device.
      </p>
    </form>
  </section>

  <!-- ================= APP ================= -->
  <div class="app" id="app-view">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar" aria-label="Primary navigation">
      <div class="brand">WO<span>G</span>O<small>ADMIN</small></div>
      <nav class="nav" id="nav">
        <button class="nav-item" data-view="bookings">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
          Bookings
        </button>
        <button class="nav-item" data-view="customers">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M17 21v-2a4 4 0 00-4-4H7a4 4 0 00-4 4v2"/><circle cx="10" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>
          Customers
        </button>
        <button class="nav-item" data-view="hours">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 20h18M7 20V10M12 20V4M17 20v-7"/></svg>
          Per hour
        </button>
        <button class="nav-item" data-view="routes">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 20l-5-2V4l5 2 6-2 5 2v14l-5-2-6 2z"/><path d="M9 6v14M15 4v14"/></svg>
          Routes
        </button>
        <button class="nav-item" data-view="giftcards">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="8" width="18" height="13" rx="2"/><path d="M12 8v13M3 12h18M7.5 8a2.5 2.5 0 010-5C10 3 12 8 12 8s2-5 4.5-5a2.5 2.5 0 010 5"/></svg>
          Gift cards
        </button>
        <button class="nav-item" data-view="export">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14"/></svg>
          Export
        </button>
      </nav>
      <div class="nav-spacer"></div>
      <div class="sidebar-foot">
        <div class="who" id="who">Signed in</div>
        <button class="nav-item" id="logout-btn">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M16 17l5-5-5-5M21 12H9M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/></svg>
          Sign out
        </button>
      </div>
    </aside>
    <div class="scrim" id="sidebar-scrim"></div>

    <!-- Main -->
    <main class="main">
      <header class="topbar">
        <button class="mobile-menu-btn" id="menu-btn" aria-label="Open menu">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div>
          <h1 id="page-title">Bookings</h1>
          <div class="sub" id="page-sub"></div>
        </div>
        <div class="grow"></div>
        <div id="topbar-actions"></div>
      </header>
      <div class="content" id="view" aria-live="polite"></div>
    </main>
  </div>

  <!-- Drawer + scrim -->
  <div class="scrim" id="drawer-scrim"></div>
  <aside class="drawer" id="drawer" aria-label="Booking detail" aria-hidden="true">
    <div class="drawer-head">
      <h2 id="drawer-title">Booking</h2>
      <div class="grow"></div>
      <button class="icon-btn" id="drawer-close" aria-label="Close">✕</button>
    </div>
    <div class="drawer-body" id="drawer-body"></div>
    <div class="drawer-foot" id="drawer-foot"></div>
  </aside>

  <div class="toast-wrap" id="toasts" aria-live="polite"></div>
</div>
